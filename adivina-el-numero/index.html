<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adivina el Número | Code Power</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <main class="contenedor">

        <a href="../../index.html" class="volver">
            ← Volver al inicio
        </a>

        <h1>🔢 Adivina el Número</h1>

        <p>
            Intenta descubrir el número secreto del 1 al 100.
        </p>

        <input
            type="number"
            id="numero"
            min="1"
            max="100"
            placeholder="Escribe un número"
        >

        <button id="comprobar">
            Comprobar
        </button>

        <p id="mensaje" class="mensaje"></p>

        <p>
            Intentos:
            <strong id="intentos">0</strong>
        </p>

        <button id="reiniciar">
            Reiniciar juego
        </button>

    </main>

    <script src="script.js"></script>

</body>

</html>

<a href="../../index.html" class="volver">
    ← Volver al inicio
</a>
