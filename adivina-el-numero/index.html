<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivina el Número | Code Power</title>
    <link rel="stylesheet" href="adivina.css">
</head>

<body>

    <header>
        <div class="logo">Code Power</div>
        <a href="../index.html" class="volver">← Volver</a>
    </header>

    <main>
        <section class="juego">

            <div class="icono">🔢</div>

            <h1>Adivina el Número</h1>

            <p class="descripcion">
                Hemos pensado un número entre <strong>1 y 100</strong>.
                ¿Puedes descubrir cuál es?
            </p>

            <div class="informacion">
                <div>
                    <span>Intentos</span>
                    <strong id="intentos">0</strong>
                </div>

                <div>
                    <span>Rango</span>
                    <strong>1 - 100</strong>
                </div>
            </div>

            <div class="zona-juego">

                <label for="numero">Escribe tu número:</label>

                <input 
                    type="number" 
                    id="numero" 
                    min="1" 
                    max="100"
                    placeholder="Ej: 50"
                >

                <button id="btnAdivinar">Adivinar</button>

                <p id="mensaje" class="mensaje">
                    ¡Escribe un número para comenzar!
                </p>

            </div>

            <button id="btnReiniciar" class="reiniciar">
                🔄 Jugar de nuevo
            </button>

        </section>
    </main>

    <footer>
        <p>© 2026 Code Power | Proyecto SENA</p>
    </footer>

    <script src="adivina.js"></script>

</body>
</html>
